site_name: VisionTrack
site_description: A from-scratch multi-object tracker used as a controlled study of when the field's standard tricks actually help.
site_url: https://visiontrack.hulage.in/docs/
copyright: MIT-licensed · built from scratch on NumPy
docs_dir: docs
site_dir: site
# Emit flat foo.html files (not foo/index.html) so the site mounts cleanly at a
# subpath (/docs) on plain static hosting without directory-index routing.
use_directory_urls: false

# docs/ doubles as GitHub-rendered markdown. Repository source and evidence
# references therefore use explicit GitHub/raw URLs, while documentation-page
# links remain local and are checked by MkDocs. A strict build is the release
# gate: any new missing target must fail rather than join a warning allowlist.
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    scheme: default
    primary: indigo
    accent: indigo

extra_css:
  - stylesheets/visiontrack.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - "← VisionTrack home": https://visiontrack.hulage.in/
  - Home: index.md
  - The study:
      - Overview (v2 paper): PROJECT_v2.md
      - Phase 0 — Real data + cached detections: PHASE0.md
      - Phase 1 — Statistical-rigor harness: PHASE1.md
      - Phase 2 — Factored association cost: PHASE2.md
      - "RQ1 — Appearance (centerpiece)": PHASE3.md
      - RQ2 — Learned motion residual: PHASE4.md
      - RQ3 — Calibrated uncertainty: PHASE5.md
      - RQ4 — Global motion compensation: GMC_RQ4.md
      - OC-SORT mechanics: OC_SORT.md
      - ID-switch error taxonomy: ERROR_TAXONOMY.md
  - Results & benchmarks: BENCHMARKS.md
  - Use it:
      - Public API: API.md
      - Run on your own video: VIDEO.md
      - 0.3.0 release-candidate scope: RELEASE_NOTES_0.3.0.md
      - Release to PyPI: RELEASE.md
      - Deploy the site: DEPLOY.md
  - Roadmap:
      - Status checklist: STATUS.md
      - Reliability Lab — first slice: RELIABILITY_LAB.md
      - Release-readiness audit: RELEASE_READINESS.md
      - Python/C++ runtime contract: CROSS_RUNTIME_CONTRACT.md
      - Horizons: HORIZONS.md
      - C++/CUDA sibling plan: CPP_CUDA_TRACKER_PLAN.md
