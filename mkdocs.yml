site_name: VisionTrack
site_description: A from-scratch multi-object tracker used as a controlled study of when the field's standard tricks actually help.
site_url: https://visiontrack.hulage.in/docs/
copyright: MIT-licensed · built from scratch on NumPy
docs_dir: docs
site_dir: site
# Emit flat foo.html files (not foo/index.html) so the site mounts cleanly at a
# subpath (/docs) on plain static hosting without directory-index routing.
use_directory_urls: false

# docs/ doubles as GitHub-rendered markdown. Repository source and evidence
# references therefore use explicit GitHub/raw URLs, while documentation-page
# links remain local and are checked by MkDocs. A strict build is the release
# gate: any new missing target must fail rather than join a warning allowlist.
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    scheme: default
    primary: indigo
    accent: indigo

extra_css:
  - stylesheets/visiontrack.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

