[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visiontrack-mot"
version = "0.1.0"
description = "Online multi-object tracking (Kalman + Hungarian + ByteTrack) built from scratch on NumPy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rushikesh Hulage" }]
keywords = ["computer-vision", "multi-object-tracking", "kalman-filter", "bytetrack", "sort"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://visiontrack.hulage.in"
Repository = "https://github.com/hulagerushikesh/visiontrack"
Issues = "https://github.com/hulagerushikesh/visiontrack/issues"

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "pillow>=9.0"]
onnx = ["onnxruntime>=1.15"]
# Run the tracker on real video files: decode/encode via imageio + ffmpeg,
# detect with an ONNX model. Lazily imported; never touched by the core.
video = ["onnxruntime>=1.15", "imageio>=2.31", "imageio-ffmpeg>=0.4", "pillow>=9.0"]
# Appearance / re-ID: the from-scratch colour-histogram embedder uses
# matplotlib's rgb_to_hsv; embedding precompute reads frames with Pillow.
appearance = ["matplotlib>=3.6", "pillow>=9.0"]
# Statistical-rigor harness under experiments/ (not needed by the core package).
experiments = ["pandas>=1.5", "pyarrow>=10", "scipy>=1.9", "pyyaml>=6", "matplotlib>=3.6"]
dev = ["pytest>=7.0", "scipy>=1.9", "matplotlib>=3.6", "pillow>=9.0", "pandas>=1.5", "pyarrow>=10", "pyyaml>=6"]

[project.scripts]
visiontrack = "visiontrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"  # real-data/long tests are opt-in: pytest -m slow
markers = ["slow: real-data or long-running tests (need dataset caches); opt in with -m slow"]
pythonpath = ["src", "."]  # "." makes the experiments/ harness importable in tests

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E741: single-char names (i, j, u, v) are idiomatic in the linear-algebra code.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# The benchmark HTML renderer is a CSS/HTML template string — long lines are content.
"experiments/_benchmark_html.py" = ["E501"]
